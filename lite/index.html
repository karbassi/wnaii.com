<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://api.bigdatacloud.net" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <title>What neighborhood am I in?</title>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-size: 10px;
            background-color: #f1f3f4;
            color: #202124;

            display: grid;
            place-items: center;
            text-align: center;
        }


        div {
            font-size: clamp(3em, 10vw, 10em);
            padding-inline: 30px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #202124;
                color: #FFF;
            }
        }
    </style>
</head>
<body>
    <div>Finding what neighborhood you're in.</div>

    <script src="https://cdn.jsdelivr.net/npm/geojson-utils@1.1.0/geojson-utils.min.js"></script>
    <script src="../assets/js/states.js?v=255af2e"></script>
    <script>
        const $out = document.querySelector('div');

        const show = (message) => {
            $out.innerText = message;
        };

        const fail = (message) => (error) => {
            console.error(error);
            show(message);
        };

        const findNeighborhood = (latitude, longitude) => {
            fetch(
                    `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`
                )
                .then((response) => {
                    if (!response.ok) throw new Error(`Reverse geocode failed: ${response.status}`);
                    return response.json();
                })
                .then((data) => {
                    const state = stateCode(data);

                    if (!state) {
                        show('Sorry, only US neighborhoods are supported.');
                        return;
                    }

                    return fetch(`../assets/geo/${state.toLowerCase()}.min.geojson`)
                        .then((response) => {
                            if (!response.ok) throw new Error(`No neighborhood data for ${state}`);
                            return response.json();
                        })
                        .then(({ features }) => {
                            const point = { type: 'Point', coordinates: [longitude, latitude] };
                            const feature = features.find((f) => gju.pointInPolygon(point, f.geometry));

                            show(feature ? feature.properties.Name : "You're not inside any neighborhood we know about.");
                        })
                        .catch(fail("Sorry, we don't have neighborhood data for your state yet."));
                })
                .catch(fail("Sorry, we couldn't look up your location."));
        };

        if (!navigator.geolocation) {
            show("Your browser doesn't support location services.");
        } else navigator.geolocation.getCurrentPosition(
            ({
                coords: {
                    latitude,
                    longitude
                }
            }) => findNeighborhood(latitude, longitude),
            (error) => {
                switch (error.code) {
                    case GeolocationPositionError.TIMEOUT:
                        show('Finding your location timed out. Reload to try again.');
                        break;
                    case GeolocationPositionError.PERMISSION_DENIED:
                        show('Please enable location services for this site in your browser settings.');
                        break;
                    default:
                        show('Location information is unavailable.');
                }
            }, {
                enableHighAccuracy: false,
                timeout: 5000,
                maximumAge: 0,
            }
        );
    </script>
</body>
</html>

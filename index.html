<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What neighborhood am I in?</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.5.1/dist/leaflet.min.css" />
</head>
<body>
  <div class="map" id="map"></div>
  <div class="geo-result">
    <span class="loading">Finding you...</span>
    <span class="found">You're in <span class="location"></span></span>
  </div>

  <script async src="https://cdn.jsdelivr.net/npm/leaflet@1.6/dist/leaflet-src.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/geojson-utils@1.1.0/geojson-utils.min.js"></script>
  <script async src="./assets/js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What neighborhood am I in?</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://api.bigdatacloud.net" crossorigin />
  <link rel="stylesheet" href="./assets/css/style.css?v=b958e3b" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="map" id="map"></div>
  <div class="geo-result">
    <span class="loading">Finding you...</span>
    <span class="found">You're in <span class="location"></span></span>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/geojson-utils@1.1.0/geojson-utils.min.js"></script>
  <script defer src="./assets/js/states.js?v=b958e3b"></script>
  <script defer src="./assets/js/script.js?v=b958e3b"></script>
</body>
</html>
